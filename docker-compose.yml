# OM Enterprise — single-server deployment (app + PostgreSQL + daily backups).
#
#   cp .env.production.example .env.production   # fill in secrets
#   docker compose --env-file .env.production up -d --build
#   docker compose --env-file .env.production run --rm tools npm run create-super-admin
#
# Put a TLS-terminating reverse proxy (Caddy / Nginx) in front of port 3000.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: om
      POSTGRES_USER: om
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U om -d om"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Applies migrations + reference data, then exits. Also used for CLI tasks.
  tools:
    build: { context: ., target: tools }
    environment:
      DATABASE_URL: postgres://om:${POSTGRES_PASSWORD}@db:5432/om
      APP_SECRET: ${APP_SECRET:?set APP_SECRET}
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  app:
    build: { context: ., target: runner }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://om:${POSTGRES_PASSWORD}@db:5432/om
      APP_SECRET: ${APP_SECRET}
      APP_BASE_URL: ${APP_BASE_URL:?set APP_BASE_URL}
      UPLOAD_DIR: /app/storage/uploads
      TRUST_PROXY: "true"
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - uploads:/app/storage/uploads
    depends_on:
      db: { condition: service_healthy }
      tools: { condition: service_completed_successfully }

  # Nightly compressed dump of the database + uploaded images, kept for 30 days.
  backup:
    image: postgres:16
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      RETENTION_DAYS: "30"
    volumes:
      - ./backups:/backups
      - uploads:/uploads:ro
      - ./scripts/backup-loop.sh:/backup-loop.sh:ro
    entrypoint: ["bash", "/backup-loop.sh"]
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
  uploads:
